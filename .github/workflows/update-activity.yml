name: Update vault activity data

on:
  schedule:
    - cron: "55 2 * * *" # 23:55 America/Sao_Paulo (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute activity.json
        run: node scripts/update-activity.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.json
          git diff --cached --quiet || (git commit -m "chore: update vault activity data" && git push)
